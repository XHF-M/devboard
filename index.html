    h += '<button data-act="copy" data-id="'+it.id+'">复制</button>';
    h += '<button data-act="edit" data-id="'+it.id+'">编辑</button>';
    h += '</span></div></div>';
  });
  h += '</div>';
  memosEl.innerHTML = h;
}

function renderTabs(){
  var cnt = {task:0,bug:0,memo:0};
  state.items.forEach(function(i){
    if(i.type==='memo'){ cnt.memo++; }
    else if(!isDone(i)) cnt[i.type]++;
  });
  $('c-task').textContent = cnt.task;
  $('c-bug').textContent = cnt.bug;
  $('c-memo').textContent = cnt.memo;
}

function renderStats(){
  var items = state.items.filter(function(i){ return i.type!=='memo'; });
  var t = todayStr(), mon = weekMonday(), sun = weekSunday();
  var over = 0, today = 0, doing = 0, weekDone = 0;
  items.forEach(function(i){
    if(isOver(i)) over++;
    if(i.due===t && !isDone(i)) today++;
    if(i.status==='doing'||i.status==='fixing'||i.status==='verify') doing++;
    if(i.doneAt){
      var d = localDate(i.doneAt);
      if(d && d>=mon && d<=sun) weekDone++;
    }
  });
  $('stats').innerHTML =
    '<span data-f="today">今天到期<b>'+today+'</b></span>'+
    '<span data-f="over" class="'+(over?'warn':'')+'">逾期<b>'+over+'</b></span>'+
    '<span class="static">进行中<b>'+doing+'</b></span>'+
    '<span class="static">本周完成<b>'+weekDone+'</b></span>';
}

function rebuildStatusFilter(){
  var sel = $('fstatus');
  var tab = state.tab;
  var opts = '<option value="">全部状态</option>';
  var sets = [];
  if(tab==='task') sets = [STATUS.task];
  else if(tab==='bug') sets = [STATUS.bug];
  else if(tab==='all') sets = [STATUS.task, STATUS.bug];
  sets.forEach(function(arr){
    arr.forEach(function(s){ opts += '<option value="'+s.k+'">'+s.n+'</option>'; });
  });
  sel.innerHTML = opts;
  sel.value = state.f.status;
  sel.disabled = (tab==='memo');
}

function render(){
  renderTabs(); renderStats(); rebuildStatusFilter();

  var tab = state.tab;
  toolbar.classList.toggle('hidden', tab==='memo');
  viewsEl.classList.toggle('hidden', tab==='all');

  board.classList.add('hidden');
  listEl.classList.add('hidden');
  memosEl.classList.add('hidden');

  if(tab==='memo'){ memosEl.classList.remove('hidden'); renderMemos(); return; }

  var view = (tab==='all') ? 'list' : state.view;
  if(view==='board'){ board.classList.remove('hidden'); renderBoard(); }
  else { listEl.classList.remove('hidden'); renderList(); }
}

function setTab(tab){
  state.tab = tab;
  state.f.status = '';
  $('fstatus').value = '';
  var all = $('tabs').querySelectorAll('button');
  for(var i=0;i<all.length;i++){
    all[i].classList.toggle('on', all[i].getAttribute('data-tab')===tab);
  }
}

/* 从一句话造一条台账记录：主界面和迷你窗共用。
   pre 传已算好的识别结果（主界面里用户可以手动取消某些识别项） */
function buildItem(raw, fallbackType, pre){
  var p = pre || parseNatural(raw, fallbackType || 'task');
  var type = p.type || fallbackType || 'task';
  var title = (p.title || raw || '').slice(0,200);
  if(!title) return null;
  var now = new Date().toISOString();
  return {
    id: type.slice(0,2)+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    type: type,
    title: title,
    note: '',
    imgs: [],
    status: type==='memo' ? '' : (type==='bug' ? 'new' : 'todo'),
    priority: type==='memo' ? '' : (p.priority || ''),
    severity: '',
    project: p.project || '',
    due: type==='memo' ? '' : (p.due || ''),
    slot: type==='memo' ? '' : (p.slot || ''),
    createdAt: now, updatedAt: now, doneAt: null, history: []
  };
}

function addItem(){
  var raw = qinput.value.trim();
  if(!raw){ qinput.focus(); return; }
  var p = computeParse();
  var it = buildItem(raw, 'task', p);
  if(!it){ toast('标题不能为空'); return; }
  var type = it.type;
  state.items.unshift(it);
  qinput.value = '';
  parseState = null;
  preview.classList.add('hidden');
  if(state.tab !== 'all' && state.tab !== type) setTab(type);
  save(); render();

  var el = document.querySelector('[data-id="'+it.id+'"]');
  if(el && el.classList.contains('card')) el.classList.add('fresh');

  var parts = [TYPE_NAME[type]];
  if(it.due) parts.push(fmtDate(it.due) + (it.slot ? ' ' + it.slot : ''));
  if(it.priority) parts.push(it.priority);
  toast('已记为「' + parts.join(' · ') + '」');
  qinput.focus();
}

function setStatus(id, status){
  var it = null;
  state.items.forEach(function(x){ if(x.id===id) it = x; });
  if(!it || it.status===status) return;
  var from = it.status;
  it.status = status;
  if(status==='done'||status==='closed') it.doneAt = new Date().toISOString();
  else it.doneAt = null;
  it.updatedAt = new Date().toISOString();
  it.history = it.history || [];
  it.history.unshift({at:it.updatedAt, field:'status', from:from, to:status});
  if(it.history.length>50) it.history.length = 50;
  save();
  if(MINI_MODE) renderMini(); else render();
  if(curId===id && drawer.classList.contains('open')) openDrawer(id);
}

function finishItem(id){
  var it = null;
  state.items.forEach(function(x){ if(x.id===id) it = x; });
  if(!it) return;
  if(isDone(it)){ toast('这条已经完成了'); return; }
  var target = (it.type==='bug') ? 'closed' : 'done';
  var prev = it.status;
  setStatus(id, target);
  toast('已完成：'+it.title.slice(0,18), '撤销', function(){
    setStatus(id, prev);
  });
}

function statusName(type, k){
  var arr = STATUS[type]||[];
  for(var i=0;i<arr.length;i++){ if(arr[i].k===k) return arr[i].n; }
  return k||'—';
}

/* ============ 条目附件：图挂在条目的 imgs 上，二进制仍在 IndexedDB ============ */
function curItem(){
  var it = null;
  if(!curId) return null;
  state.items.forEach(function(x){ if(x.id === curId) it = x; });
  return it;
}
function itemImgTotal(){
  var n = 0;
  state.items.forEach(function(it){ n += (it.imgs || []).length; });
  return n;
}
function imgsBlock(it){
  var list = it.imgs || [];
  var h = '<div class="dimgs" id="dimgs">';
  if(list.length){
    h += '<div class="dimghd"><span class="dimcnt">附件 ' + list.length + '/' + IMG_ITEM_MAX + '</span>'
       + '<span class="dimtip">Ctrl+V 贴截图，或把图拖进来</span></div>';
  }
  h += '<div class="dimgrow">';
  list.forEach(function(m){
    h += '<div class="dimg loading" data-img="' + esc(m.imgId) + '" title="' + esc(m.label || '图片') + '">'
       +   '<button class="dimgx" data-del="' + esc(m.imgId) + '" title="删掉这张">×</button>'
       + '</div>';
  });
  if(list.length < IMG_ITEM_MAX && itemImgTotal() < IMG_ITEM_TOTAL_MAX){
    h += '<button class="dimgpick" type="button">' + (list.length ? '＋' : '＋ 图片') + '</button>';
  }
  h += '</div>';
  if(!list.length) h += '<div class="dimgtip2">附图：报错截图、设计稿都行，Ctrl+V 直接贴</div>';
  h += '</div>';
  return h;
}
function paintImgs(){
  var it = curItem();
  if(!it) return;
  var row = drawer.querySelector('.dimgrow');
  if(!row) return;
  (it.imgs || []).forEach(function(m){
    var box = row.querySelector('.dimg[data-img="' + m.imgId + '"]');
    if(!box) return;
    var done = function(url){
      if(!box.isConnected) return;
      box.classList.remove('loading');
      if(!url){
        box.classList.add('broken');
        box.title = (m.label || '图片') + ' 的数据不在了，可能是浏览器清过站点数据';
        return;
      }
      var img = box.querySelector('img');
      if(!img){ img = document.createElement('img'); img.alt = ''; box.insertBefore(img, box.firstChild); }
      img.src = url;
    };
    if(imgURLs[m.imgId]){ done(imgURLs[m.imgId]); return; }
    IDB.get(m.imgId).then(function(rec){
      if(!rec || !rec.blob){ done(''); return; }
      var url = URL.createObjectURL(rec.blob);
      imgURLs[m.imgId] = url;
      done(url);
    }).catch(function(){ done(''); });
  });
}
/* 只重绘附件条这一块：整块重建抽屉会把正在打的备注和光标一起冲掉 */
function renderImgs(){
  var it = curItem();
  if(!it) return;
  var box = drawer.querySelector('#dimgs');
  if(!box) return;
  var holder = document.createElement('div');
  holder.innerHTML = imgsBlock(it);
  var fresh = holder.firstElementChild;
  box.parentNode.replaceChild(fresh, box);
  paintImgs();
}
function addItemImgs(files){
  var it = curItem();
  if(!it) return;
  if(!IDB.available()){ toast('当前浏览器不支持图片存储，请用 Chrome 打开'); return; }
  var roomOne = IMG_ITEM_MAX - (it.imgs || []).length;
  var roomAll = IMG_ITEM_TOTAL_MAX - itemImgTotal();
  if(roomOne <= 0){ toast('这条已满 ' + IMG_ITEM_MAX + ' 张，先删一张'); return; }
  if(roomAll <= 0){ toast('条目附件已满 ' + IMG_ITEM_TOTAL_MAX + ' 张（所有条目的附件合计），先删几张'); return; }
  storeImages(files, Math.min(roomOne, roomAll)).then(function(r){
    if(!r.made.length){
      if(r.failed) toast('有 ' + r.failed + ' 张写入失败（可能磁盘空间不足）');
      return;
    }
    var t = curItem();
    if(!t){ releaseImgPending(r.made); return; }   // 存图途中抽屉被关掉，图留着等 GC 收
    if(!t.imgs) t.imgs = [];
    r.made.forEach(function(m){ t.imgs.push(m); });
    releaseImgPending(r.made);
    t.updatedAt = new Date().toISOString();
    save(); renderImgs(); render();
    if(r.failed){ toast('有 ' + r.failed + ' 张写入失败（可能磁盘空间不足）'); return; }
    var ids = r.made.map(function(m){ return m.imgId; });
    toast('已加 ' + ids.length + ' 张图', '撤销', function(){
      var x = curItem();
      if(!x) return;
      x.imgs = (x.imgs || []).filter(function(m){ return ids.indexOf(m.imgId) < 0; });
      save(); renderImgs(); render();
      scheduleImgGC();
    });
  });
}
function delItemImg(imgId){
  var it = curItem();
  if(!it) return;
  var idx = -1, got = null;
  (it.imgs || []).forEach(function(m, i){ if(m.imgId === imgId){ idx = i; got = m; } });
  if(idx < 0) return;
  it.imgs.splice(idx, 1);
  it.updatedAt = new Date().toISOString();
  save(); renderImgs();
  scheduleImgGC();                      // 8 秒后才真删 blob，撤销窗口内拿得回
  toast('图片已删除', '撤销', function(){
    var x = curItem();
    if(!x) return;
    if(!x.imgs) x.imgs = [];
    var dup = false;
    x.imgs.forEach(function(k){ if(k.imgId === got.imgId) dup = true; });
    if(!dup) x.imgs.splice(Math.min(idx, x.imgs.length), 0, got);
    save(); renderImgs();
  });
}
function onDrawerImgClick(e){

function onDrawerPaste(e){
  if(!curId || shelfOpen) return;
  // paste 的目标是「当前聚焦元素」，焦点在抽屉外时事件根本不经过 drawer。
  // 所以监听挂在 document 上，按目标判断：在抽屉里、或压根没聚焦任何输入框，才接管；
  // 焦点在页面其它输入框（搜索、录入）时一律放过，别抢人家的粘贴。
  var t = e.target;
  var inDrawer = !!(t && t.closest && (t === drawer || drawer.contains(t)));
  var loose = (t === document.body || t === document.documentElement);
  if(!inDrawer && !loose) return;
  var cd = e.clipboardData || window.clipboardData;
  var picked = pickClipboardImages(cd);
  if(!picked.length) return;            // 纯文字不拦，走浏览器原生粘贴
  e.preventDefault();
  addItemImgs(picked);
}
function onDrawerDragOver(e){
  if(!curId) return;
  var dt = e.dataTransfer;
  if(!dt) return;
  var has = false;
  if(dt.items){
    for(var i=0;i<dt.items.length;i++){
      if(dt.items[i].kind === 'file' && /^image\//.test(dt.items[i].type || '')) has = true;
    }
  }
  if(!has) return;
  e.preventDefault(); e.stopPropagation();
  try{ dt.dropEffect = 'copy'; }catch(_){}
  drawer.classList.add('drop');
}
function onDrawerDrop(e){
  drawer.classList.remove('drop');
  var dt = e.dataTransfer;
  if(!dt) return;
  var files = [].slice.call(dt.files || []).filter(function(f){ return /^image\//.test(f.type || ''); });
  if(!files.length) return;
  e.preventDefault(); e.stopPropagation();
  addItemImgs(files);
}
/* 抽屉是持久元素，监听只挂一次；处理函数里一律按 curId 重新取条目，
   因为 watchStore / syncFromStore 会把 state.items 整个换掉。*/
var drawerBound = false;
function bindDrawerImgs(){
  if(drawerBound) return;
  drawerBound = true;
  drawer.addEventListener('click', onDrawerImgClick);
  // paste 要挂在 document：焦点不在抽屉里时，事件不会冒泡经过 drawer
  document.addEventListener('paste', onDrawerPaste);
  drawer.addEventListener('dragover', onDrawerDragOver);
  drawer.addEventListener('dragleave', function(e){
    if(e.target === drawer || !drawer.contains(e.relatedTarget)) drawer.classList.remove('drop');
  });
  drawer.addEventListener('drop', onDrawerDrop);
}

function onFieldInput(e){
  var el = e.target;
  var f = el.getAttribute('data-f');
  if(!curId) return;
  var it = null;
  state.items.forEach(function(x){ if(x.id===curId) it = x; });
  if(!it) return;
  var v = el.value;
  if(f==='title' && v.length>200) v = v.slice(0,200);
  if(it[f]===v) return;

  var old = it[f];
  it[f] = v;
  it.updatedAt = new Date().toISOString();

  if(f==='status'){
    if(v==='done'||v==='closed') it.doneAt = new Date().toISOString();
    else it.doneAt = null;
  }
  if(f==='status'||f==='priority'||f==='due'||f==='slot'){
    it.history = it.history || [];
    it.history.unshift({at:it.updatedAt, field:f, from:old, to:v});
    if(it.history.length>50) it.history.length = 50;
  }
  if(f==='status'){
    var head = drawer.querySelector('.dtype');
    if(head) head.textContent = TYPE_NAME[it.type] + ' · ' + statusName(it.type, v);
  }
  if(f==='title'||f==='note'||f==='project'){
    scheduleSave();
  }else{
    clearTimeout(saveTimer);
    save(); render();
  }
}

function deleteItem(id){

function buildDigest(){
  var items = state.items.filter(function(i){ return i.type!=='memo'; });
  var t = todayStr();
  var over = sortItems(items.filter(isOver));
  var today = sortItems(items.filter(function(i){ return i.due===t && !isDone(i); }));
  var doing = sortItems(items.filter(function(i){ return i.status==='doing'||i.status==='fixing'||i.status==='verify'; }));
  var todo = sortItems(items.filter(function(i){ return i.status==='todo'||i.status==='new'; })).slice(0,10);
  var memo = state.items.filter(function(i){ return i.type==='memo'; }).slice(0,5);

  var lines = [];
  lines.push('【开发台板 · '+t+'】');
  lines.push('逾期 '+over.length+' · 今天 '+today.length+' · 进行中 '+doing.length);
  function block(title, arr){
    if(!arr.length) return;
    lines.push('');
    lines.push('▍'+title);
    arr.forEach(function(i){
      var s = '- ';
      if(i.priority) s += '['+i.priority+'] ';
      s += i.title;
      if(i.due) s += '（'+fmtDate(i.due)+(i.slot?' '+i.slot:'')+'）';
      if(i.project) s += ' #'+i.project;
      lines.push(s);
    });
  }
  block('逾期', over);
  block('今天到期', today);
  block('进行中', doing);
  block('待办', todo);
  if(memo.length){
    lines.push('');
    lines.push('▍备忘');
    memo.forEach(function(i){ lines.push('- '+i.title.replace(/\n/g,' ')); });
  }
  return lines.join('\n');
}

function copyText(text, okMsg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try{
      var ok = document.execCommand('copy');
      ta.remove();
      if(ok) toast(okMsg||'已复制');
      else showCopyModal(text);
    }catch(e){
      ta.remove();
      showCopyModal(text);
    }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg||'已复制'); }, fallback);
  }else{
    fallback();
  }
}

function showCopyModal(text){
  var m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<div class="box"><h3>自动复制被浏览器拦了，手动复制下面这段：</h3>'
    + '<textarea readonly></textarea><div class="row">'
    + '<button id="mclose">关闭</button><button class="primary" id="mcopy">再试一次</button></div></div>';
  document.body.appendChild(m);
  var ta = m.querySelector('textarea');
  ta.value = text;
  ta.focus(); ta.select();
  m.querySelector('#mclose').onclick = function(){ m.remove(); };
  m.querySelector('#mcopy').onclick = function(){ ta.select(); document.execCommand('copy'); toast('已复制'); m.remove(); };
  m.addEventListener('click', function(e){ if(e.target===m) m.remove(); });
}

function trimClips(){

function paintThumb(c){
  var box = shlist.querySelector('.clip[data-id="' + c.id.replace(/"/g,'') + '"] .cthumb');
  if(!box) return;
  var img = box.querySelector('img');
  var done = function(url){
    if(!box.isConnected) return;
    box.classList.remove('loading');
    if(!url){ box.classList.add('broken'); return; }
    img.src = url;
  };
  if(!c.imgId){ box.classList.add('broken'); box.classList.remove('loading'); return; }
  if(imgURLs[c.imgId]){ done(imgURLs[c.imgId]); return; }
  IDB.get(c.imgId).then(function(rec){
    if(!rec || !rec.blob){ done(''); return; }
    var url = URL.createObjectURL(rec.blob);
    imgURLs[c.imgId] = url;
    done(url);
  }).catch(function(){ done(''); });
}
function findClip(id){
  var r = null;
  state.clips.forEach(function(c){ if(c.id===id) r = c; });
  return r;
}
function deleteClip(id){

  save(); renderShelf();
  if(c.kind === 'img') scheduleImgGC();
  toast(c.kind === 'img' ? '图片已删除' : '片段已删除', '撤销', function(){
    if(!findClip(c.id)) state.clips.splice(Math.min(idx, state.clips.length), 0, c);
    save(); renderShelf();
  });
}
function clipToEditor(c){

    state.draft = {text:'', updatedAt:new Date().toISOString()};
    save(); renderShelf(); updateDraftMeta();
  });
}

/* 备份要把两处的图都算上：暂存板片段 + 各条目附件 */
function allImgRefs(){
  var out = imgClips().slice();
  state.items.forEach(function(it){
    (it.imgs || []).forEach(function(m){ out.push(m); });
  });
  return out;
}
function exportJSON(){
  var imgs = allImgRefs();
  if(!imgs.length){ doExportJSON(null, 0); return; }
  var bytes = imgs.reduce(function(s, c){ return s + (c.imgSize || 0); }, 0);
  var withImg = confirm('要连 ' + imgs.length + ' 张图片（暂存板 + 各条目附件）一起导出吗？（原图约 ' + fmtSize(bytes) + '，打包进 JSON 后会更大）\n\n确定：换电脑 / 重装浏览器后图片也能恢复\n取消：只导出条目和文字片段，图片留在本机');
  if(!withImg){ doExportJSON(null, 0); return; }
  toast('正在打包 ' + imgs.length + ' 张图片…');
  packImages(imgs).then(function(map){
    doExportJSON(map, Object.keys(map).length);
  }).catch(function(){
    toast('打包图片失败，改为只导出文字');
    doExportJSON(null, 0);
  });
}
function packImages(list){
  var out = {};
  var chain = list.reduce(function(p, c){
    return p.then(function(){
      return IDB.get(c.imgId).then(function(rec){
        if(!rec || !rec.blob) return;
        return blobToDataURL(rec.blob).then(function(u){ out[c.imgId] = u; });
      }).catch(function(){});
    });
  }, Promise.resolve());
  return chain.then(function(){ return out; });
}
function doExportJSON(images, imgN){
  var data = {version:2, exportedAt:new Date().toISOString(), items:state.items, clips:state.clips, draft:state.draft};
  if(images && Object.keys(images).length) data.images = images;
  var blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '开发台板-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  toast(imgN ? ('已导出备份，含 ' + imgN + ' 张图片') : '已导出备份文件');
}

function importJSON(file){
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try{ data = JSON.parse(reader.result); }catch(e){ toast('文件解析失败，不是有效 JSON'); return; }
    if(!data || !Array.isArray(data.items)){ toast('这不是本产品导出的备份文件'); return; }
    var n = data.items.length;
    var cn = Array.isArray(data.clips) ? data.clips.length : 0;
    var ok = confirm('将用备份中的 ' + n + ' 条记录、' + cn + ' 个片段覆盖当前数据（当前 ' + state.items.length + ' 条 / ' + state.clips.length + ' 个片段），确定吗？');
    if(!ok) return;
    state.items = normalizeItems(data.items);
    state.clips = normalizeClips(data.clips);
    state.draft = normalizeDraft(data.draft);
    shinput.value = state.draft.text;
    updateDraftMeta();
    lastDeleted = null;
    save(); render(); renderShelf();

    var imgs = (data.images && typeof data.images === 'object') ? data.images : null;
    var keys = imgs ? Object.keys(imgs) : [];
    if(!keys.length){
      gcImages();
      toast('已恢复 ' + n + ' 条记录、' + cn + ' 个片段');
      return;
    }
    Promise.all(keys.map(function(k){
      return dataURLToBlob(imgs[k]).then(function(blob){
        var meta = null;
        state.clips.forEach(function(c){ if(c.kind === 'img' && c.imgId === k) meta = c; });
        if(!meta) state.items.forEach(function(it){
          (it.imgs || []).forEach(function(m){ if(m.imgId === k) meta = m; });
        });
        return IDB.put({id:k, blob:blob, type:(meta && meta.imgType) || blob.type || 'image/png',
          size:blob.size, w:(meta && meta.imgW) || 0, h:(meta && meta.imgH) || 0,
          createdAt:new Date().toISOString()});
      }).catch(function(){});
    })).then(function(){
      Object.keys(imgURLs).forEach(function(k){ imgDropURL(k); });
      renderShelf();
      gcImages();
      toast('已恢复 ' + n + ' 条记录、' + cn + ' 个片段、' + keys.length + ' 张图片');
    });
  };
  reader.readAsText(file);
}

/* 暂存板 + 唤出快捷键：主窗要、小窗也要，所以单独抽出来两边都调。
   以前这些绑定长在 bindEvents 里，小窗走 initMini 直接 return，暂存板就成了块死板子。*/
function bindShelf(){
  // 录制快捷键：捕获阶段拦截，避免同时触发页面里其它快捷键
  document.addEventListener('keydown', function(e){
    if(!hkRecording) return;
    e.preventDefault();
    e.stopPropagation();
    if(e.key === 'Escape'){ closeHotkeyDlg(); return; }
    if(/^(Shift|Control|Alt|Meta|CapsLock|OS)$/.test(e.key)) return;
    var combo = eventCombo(e);
    if(!comboValid(combo)){
      var cap = $('hkcap');
      cap.className = 'hkcap bad';
      cap.textContent = hotkeyLabel(combo) + ' 不能用，换一个组合';
      return;
    }
    applyHotkey(combo);
  }, true);
  document.addEventListener('keydown', function(e){
    // 全文预览开着时，Esc / 唤出键都先只关预览，别顺手把整个暂存板收掉
    if(_tvEl){
      if(e.key==='Escape' || isHotkey(e)){ e.preventDefault(); closeTextView(); }
      return;
    }
    if(isHotkey(e)){ e.preventDefault(); toggleShelf(); return; }
    if(e.key==='Escape'){
      if(drawer.classList.contains('open')) closeDrawer();
      else if(shelfOpen) closeShelf();
      else if(!preview.classList.contains('hidden')){ preview.classList.add('hidden'); }
    }
  });

  $('btnclip').onclick = toggleShelf;
  $('shclose').onclick = closeShelf;
  $('shhotkey').onclick = openHotkeyDlg;
  $('hkcancel').onclick = closeHotkeyDlg;
  $('hkreset').onclick = function(){ applyHotkey(DEFAULT_HOTKEY); };
  $('hkdlg').addEventListener('click', function(e){
    if(e.target === $('hkdlg')) closeHotkeyDlg();
  });
  shinput.addEventListener('input', onDraftInput);
  shinput.addEventListener('keydown', function(e){
    if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); shelfSave(); }
  });
  shinput.addEventListener('paste', function(e){
    var cd = e.clipboardData || window.clipboardData;
    if(!cd) return;

    // 截图优先：剪贴板里有图就直接存成图片片段，不动编辑区里的文字
    var picked = pickClipboardImages(cd);
    if(picked.length){
      e.preventDefault();
      addImageClips(picked);
      return;
    }

    var before = shinput.value;
    if(!before.trim()) return;
    var txt = cd.getData('text');
    e.preventDefault();
    var c = archiveDraft();
    if(!c) return;
    shinput.value = txt;
    onDraftInput();
    save(); renderShelf();
    toast('上一段已存为片段', '撤销', function(){
      state.clips = state.clips.filter(function(x){ return x.id !== c.id; });
      shinput.value = c.text;
      state.draft = {text:c.text, updatedAt:new Date().toISOString()};
      save(); renderShelf(); updateDraftMeta();
      shinput.focus();
    });
  });
  shpickimg.onclick = function(){ shfile.click(); };
  shfile.addEventListener('change', function(e){
    addImageClips(e.target.files);
    e.target.value = '';
  });
  shelfEl.addEventListener('dragover', function(e){
    var dt = e.dataTransfer;
    if(!dt) return;
    var hasImg = false;
    if(dt.items){
      for(var i=0;i<dt.items.length;i++){
        if(dt.items[i].kind === 'file' && /^image\//.test(dt.items[i].type || '')) hasImg = true;
      }
    }
    if(!hasImg) return;
    e.preventDefault(); e.stopPropagation();
    try{ dt.dropEffect = 'copy'; }catch(_){}
    shelfEl.classList.add('drop');
  });
  shelfEl.addEventListener('dragleave', function(e){
    if(e.target === shelfEl || !shelfEl.contains(e.relatedTarget)) shelfEl.classList.remove('drop');
  });
  shelfEl.addEventListener('drop', function(e){
    shelfEl.classList.remove('drop');
    var dt = e.dataTransfer;
    if(!dt) return;
    var files = [].slice.call(dt.files || []).filter(function(f){ return /^image\//.test(f.type || ''); });
    if(!files.length) return;
    e.preventDefault(); e.stopPropagation();
    addImageClips(files);
  });
  $('shsave').onclick = shelfSave;
  // 窗口尺寸变了，折行位置也变，重新判断哪些片段被截断
  var _rsT = null;
  window.addEventListener('resize', function(){
    clearTimeout(_rsT);
    _rsT = setTimeout(markTruncated, 160);
  });
  $('shclear').onclick = shelfClear;
  shq.addEventListener('input', renderShelf);
  shlist.addEventListener('click', function(e){
    var el = e.target.closest('.clip');
    if(!el) return;
    var c = findClip(el.getAttribute('data-id'));
    if(!c) return;
    var btn = e.target.closest('button[data-act]');
    var act;
    if(btn) act = btn.getAttribute('data-act');
    else if(c.kind === 'img') act = 'view';
    else act = el.classList.contains('trunc') ? 'preview' : 'copy';   // 被截断的长片段：点正文先看全文
    if(act==='preview'){ openTextView(c); }
    else if(act==='copy'){ copyText(c.text, '已复制 ' + c.text.length + ' 字'); }
    else if(act==='view'){ openLightbox(c, visibleImgClips()); }
    else if(act==='copyimg'){
      copyImageClip(c, function(ok, why){
        toast(ok ? '图片已复制，去微信里粘贴吧' : ('复制失败：' + (why || '') + '，点「看大图」后右键复制'));
      });
    }
    else if(act==='pin'){
      c.pinned = !c.pinned;
      c.updatedAt = c.updatedAt || new Date().toISOString();
      save(); renderShelf();
      toast(c.pinned ? '已固定到最上面' : '已取消固定');
    }
    else if(act==='edit'){ clipToEditor(c); }
    else if(act==='del'){ deleteClip(c.id); }
  });
  var mc = $('mclip');
  if(mc) mc.onclick = toggleShelf;
}

/* ==================== 迷你悬浮窗 ==================== */
function readRaw(){
  try{ return localStorage.getItem(KEY) || ''; }catch(e){ return ''; }
}
/* 把存储里的最新数据吃进内存 */
function syncFromStore(){
  var s = load();
  state.items = s.items; state.clips = s.clips; state.draft = s.draft;
  state.hotkey = s.hotkey || state.hotkey;
}
/* 另一个窗口改过数据就重画 */
function watchStore(){
  var raw = readRaw();
  if(!raw || raw === lastRaw) return;
  syncFromStore();
  if(MINI_MODE) renderMini();
  else { render(); if(shelfOpen) renderShelf(); }
}

/* ============ 主面板 / 悬浮窗 二选一 ============
   规则：谁最后打开，谁留下。打开方在这里「认领」窗口，另一方发现自己是旧的，
   就自己退场（--app 窗口允许脚本关自己；普通浏览器标签关不掉，就只给一句提示）。
   为什么要自己关自己：两个窗口都是本机文件页，没有服务端能替它们做仲裁，
   而 window.close() 恰好对 app 窗口有效，所以用一条共享标记 + 400ms 复查就够。*/
function readClaim(){
  try{
    var raw = localStorage.getItem(WIN_KEY);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || !o.mode || !o.at) return null;
    return o;
  }catch(e){ return null; }
}

function claimWindow(mode){
  myClaimAt = Date.now();
  try{ localStorage.setItem(WIN_KEY, JSON.stringify({mode:mode, at:myClaimAt})); }catch(e){}
  // storage 事件在 file:// 下不一定触发，所以再挂一个轻量轮询兜底
  setInterval(function(){ checkClaim(mode); }, 400);
  try{
    window.addEventListener('storage', function(e){
      if(e.key === WIN_KEY) checkClaim(mode);
    });
  }catch(e){}
}

/* 让位：关掉自己；关不掉就把话说清楚，不留「两个窗口都开着」的迷惑 */
function stepAside(mode){
  try{ window.close(); }catch(e){}
  setTimeout(function(){
    if(document.hidden) return;
    if(mode === 'mini') toast('主台板开了，这个小窗让位');
    else {
      var b = document.querySelector('.banner');
      if(b) b.textContent = '悬浮窗已接管，主面板可以让位了（关掉本页即可）';
      else showBanner('悬浮窗已接管，主面板可以让位了（关掉本页即可）');
    }
  }, 320);
}

function checkClaim(mode){
  var o = readClaim();
  if(!o) return false;
  if(o.mode === mode) return false;      // 还是自己占着
  if(o.at <= myClaimAt) return false;    // 对方比我先打开，我才是最新的
  stepAside(mode);
  return true;
}

/* 迷你窗：没在用（另一程序在前台）时给页面一个轻量态，配合系统层的半透明 */
function bindAway(){
  function sync(){
    var away = false;
    try{ away = !document.hasFocus(); }catch(e){}
    document.documentElement.classList.toggle('mini-away', away);
  }
  window.addEventListener('focus', sync);
  window.addEventListener('blur', sync);
  document.addEventListener('visibilitychange', sync);
  sync();
  awayTimer = setInterval(sync, 800);
}

/* 贴边收起：窗口位置/透明度都在系统层（mini-top.py）管，页面没法直接喊话，
   只能通过窗口标题递一句——标题尾部带 ⇥ 就表示「要贴边收起」。
   开关存在本机，关掉再打开还是上次的设置。 */
var EDGE_KEY = 'devboard.edgehide';

function edgeOn(){
  try{ return localStorage.getItem(EDGE_KEY) === '1'; }catch(e){ return false; }
}

function syncTitle(){
  var on = edgeOn();
  var t = '待办 · 悬浮窗' + (on ? ' ⇥' : '');     // 后缀就是给脚本看的信号
  if(document.title !== t) document.title = t;
  document.documentElement.classList.toggle('edge-on', on);
  var b = document.getElementById('medge');
  if(b){
    b.classList.toggle('on', on);
    b.title = on ? '贴边收起：已开（鼠标移开会藏到屏幕边上，再点一下关掉）'
                 : '贴边收起：打开后窗口吸到屏幕边上，鼠标移开就只留一条窄边';
  }
}

function toggleEdge(){
  var on = !edgeOn();
  try{ localStorage.setItem(EDGE_KEY, on ? '1' : '0'); }catch(e){}
  syncTitle();
  toast(on ? '贴边收起已开，鼠标移开会藏到屏幕边上，划过屏幕边缘就回来' : '贴边收起已关');
}

function miniBuckets(){
  var t = todayStr(), over = [], today = [], rest = [];
  state.items.forEach(function(i){
    if(i.type === 'memo' || isDone(i)) return;
    if(isOver(i)) over.push(i);
    else if(i.due === t) today.push(i);
    else rest.push(i);
  });
  return {over:sortItems(over), today:sortItems(today), rest:sortItems(rest)};
}

function miniRow(it){
  var meta = '<span class="tag t-'+it.type+'">'+TYPE_NAME[it.type]+'</span>';
  if(it.priority) meta += '<span class="tag pri">'+it.priority+'</span>';
  if(it.status==='doing'||it.status==='fixing'||it.status==='verify') meta += '<span>进行中</span>';
  if(it.due) meta += '<span class="'+(isOver(it)?'od':'')+'">'+fmtDate(it.due)+(it.slot?' '+it.slot:'')+'</span>';

  var h = '<div class="mrow" data-id="'+it.id+'">';
  h += '<button class="mck" data-act="done" title="标记完成"></button>';
  h += '<div class="mbody"><div class="mt">'+esc(it.title||'（无标题）')+'</div>';
  h += '<div class="mm">'+meta+'</div>';
  if(expandedId === it.id){
    h += '<div class="mnote">';
    h += it.note ? esc(it.note) : '<span class="dim">（没写备注）</span>';
    if(it.project) h += '<div class="dim" style="margin-top:3px">#'+esc(it.project)+'</div>';
    h += '<div class="mgo" data-act="goto">在台板里打开 ↗</div>';
    // 小窗里不放缩略图也不放图墙：只报个数，点开回主面板看大图
    if(it.imgs && it.imgs.length){
      h += '<div class="mgo" data-act="goto">' + it.imgs.length + ' 张图 ↗</div>';
    }
    h += '</div>';
  }
  h += '</div></div>';
  return h;
}

function renderMini(){
  var b = miniBuckets();
  var total = b.over.length + b.today.length + b.rest.length;

  $('mstat').innerHTML =
    '<span class="'+(b.over.length?'hot':'')+'">逾期 <b>'+b.over.length+'</b></span>'+
    '<span>今天 <b>'+b.today.length+'</b></span>'+
    '<span>其它 <b>'+b.rest.length+'</b></span>';

  var h = '';
  if(b.over.length) h += '<div class="mgroup"><div class="mghead over"><i></i>逾期 <b>'+b.over.length+'</b></div>'+b.over.map(miniRow).join('')+'</div>';
  if(b.today.length) h += '<div class="mgroup"><div class="mghead today"><i></i>今天 <b>'+b.today.length+'</b></div>'+b.today.map(miniRow).join('')+'</div>';
  if(b.rest.length) h += '<div class="mgroup"><div class="mghead"><i></i>未完成 <b>'+b.rest.length+'</b></div>'+b.rest.map(miniRow).join('')+'</div>';
  if(!total) h = '<div class="miniempty">没有待办了。<br>底下说一句话就能记一条。</div>';
  $('mlist').innerHTML = h;
  syncTitle();
}

function miniFinish(id){
  syncFromStore();                       // 先吃下别处刚写的数据，免得覆盖
  var it = null;
  state.items.forEach(function(x){ if(x.id===id) it = x; });
  if(!it){ renderMini(); return; }
  var prev = it.status;
  var target = (it.type==='bug') ? 'closed' : 'done';
  setStatus(id, target);                 // 内部会 save + renderMini
  expandedId = null;
  renderMini();
  toast('已完成：'+String(it.title||'').slice(0,16), '撤销', function(){
    setStatus(id, prev);
  });
}

function miniAdd(){
  var el = $('mqi');
  var raw = (el.value||'').trim();
  if(!raw){ el.focus(); return; }
  syncFromStore();
  var it = buildItem(raw, 'task');
  if(!it) return;
  state.items.unshift(it);
  save(); renderMini();
  el.value = '';
  var parts = [TYPE_NAME[it.type]];
  if(it.due) parts.push(fmtDate(it.due) + (it.slot ? ' ' + it.slot : ''));
  if(it.priority) parts.push(it.priority);
  toast('已记为「' + parts.join(' · ') + '」');
  var row = $('mlist').querySelector('[data-id="'+it.id+'"]');
  if(row && row.scrollIntoView) row.scrollIntoView({block:'nearest'});
}

function miniOpenMain(){
  var w = null;
  try{ w = window.open('index.html', 'devboard_main'); }catch(e){}
  if(!w){ toast('台板窗口没开，双击桌面「开发台板」'); return; }
  try{ w.focus(); }catch(e){}
  // 二选一：主窗起来了，小窗让位
  setTimeout(function(){ try{ window.close(); }catch(e){} }, 150);
}
function miniGoto(id){
  try{ localStorage.setItem(FOCUS_KEY, JSON.stringify({id:id, at:Date.now()})); }catch(e){}
  miniOpenMain();
}

function bindMini(){
  $('mlist').addEventListener('click', function(e){
    var row = e.target.closest('.mrow');
    if(!row) return;
    var id = row.getAttribute('data-id');
    var actEl = e.target.closest('[data-act]');
    if(actEl){
      var a = actEl.getAttribute('data-act');
      if(a==='done'){ miniFinish(id); return; }
      if(a==='goto'){ miniGoto(id); return; }
    }
    expandedId = (expandedId === id) ? null : id;
    renderMini();
  });
  $('mmain').onclick = miniOpenMain;
  var me = $('medge');
  if(me) me.onclick = toggleEdge;
  $('mqadd').onclick = miniAdd;
  $('mqi').addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); miniAdd(); }
    else if(e.key==='Escape'){ $('mqi').blur(); }
  });
  document.addEventListener('keydown', function(e){
    // 暂存板开着时 Esc 先关它，别顺手把下面那条待办的展开也收了
    if(e.key==='Escape' && expandedId && !shelfOpen){ expandedId = null; renderMini(); }
  });
}

function initMini(){
  var s = load();
  state.items = s.items; state.clips = s.clips; state.draft = s.draft;
  state.hotkey = s.hotkey || DEFAULT_HOTKEY;
  bindMini();
  // 暂存板在小窗里是整窗覆盖，但事件、草稿、片段列表得和主窗一样先就位
  bindShelf();
  renderHotkey();
  shinput.value = state.draft.text || '';
  updateDraftMeta();
  renderShelf();
  renderMini();
  syncTitle();
  // 标题是页面递给系统层的唯一信号，隔一会儿对一遍（别处若把它改回去，这里补上）
  setInterval(syncTitle, 1500);
  watchTimer = setInterval(watchStore, 1200);
  window.addEventListener('focus', watchStore);
  bindAway();
  claimWindow('mini');
  $('mqi').focus();
}

/* 主窗：接收迷你窗发来的「在这条上打开」请求 */
function pollFocusRequest(){
  if(MINI_MODE) return;
  var raw = null;
  try{ raw = localStorage.getItem(FOCUS_KEY); }catch(e){ return; }
  if(!raw) return;
  var o = null;
  try{ o = JSON.parse(raw); }catch(e){ return; }
  if(!o || !o.id || !o.at || o.at === lastFocusAt) return;
  lastFocusAt = o.at;
  var has = false;
  state.items.forEach(function(x){ if(x.id===o.id) has = true; });
  if(!has) syncFromStore();
  openDrawer(o.id);
  try{ window.focus(); }catch(e){}
}

function init(){
  try{
    localStorage.setItem('__devboard_test','1');
    localStorage.removeItem('__devboard_test');
  }catch(e){
    storageOK = false;
    if(!MINI_MODE) showBanner('当前环境禁用了本地存储，数据只保留在内存中，关掉页面就没了。请改用普通窗口打开本文件。');
  }
  if(MINI_MODE){ initMini(); return; }
  window.name = 'devboard_main';
  var store = storageOK ? load() : {items:[],clips:[],draft:{text:'',updatedAt:''},hotkey:DEFAULT_HOTKEY};
  state.items = store.items;
  state.clips = store.clips;
  state.draft = store.draft;
  state.hotkey = store.hotkey || DEFAULT_HOTKEY;
  if(!state.items.length){
    var now = new Date().toISOString();
    var tmr = new Date(); tmr.setDate(tmr.getDate()+1);
    state.items = [
      {id:'sm_1',type:'task',title:'把 PRD 里的「二期」拆成条目',note:'PRD 第十四节留了三个遗留问题，先记下来别丢。',status:'todo',priority:'P2',severity:'',project:'台板',due:weekSunday(),slot:'',createdAt:now,updatedAt:now,doneAt:null,history:[]},
      {id:'sm_2',type:'bug',title:'点登录按钮后 401 不跳转',note:'复现：清空缓存 → 未登录直接访问 /home → 接口返回 401 → 页面白屏，没有跳登录页。\n预期：401 时跳转登录，并带回跳参数。',status:'fixing',priority:'P1',severity:'严重',project:'认证',due:todayStr(),slot:'下午',createdAt:now,updatedAt:now,doneAt:null,history:[]},
      {id:'sm_3',type:'memo',title:'上面输入框可以直接说人话，比如：\n需求 查看无障碍攻略数据能不能转到社区 明天上午\n\n回车后会自动识别成「需求」，截止日明天、上午，标题只保留中间那段。',note:'',status:'',priority:'',severity:'',project:'',due:'',slot:'',createdAt:now,updatedAt:now,doneAt:null,history:[]}
    ];
    if(!state.clips.length){
      state.clips = [{
        id:'cl_sm',
        text:'（这里是暂存板，随手贴的文本都放这）\n\n按 Alt+S 随时唤出（这个键可以改，面板头部点一下就行），粘完关掉，不用点保存。\n编辑区的内容自动存在本机，下次打开还在。\n\n想归档成一条，点「存为片段」。',
        pinned:false, createdAt:now, updatedAt:now
      }];
    }
    save();
  } else if(needMigrate){
    // 旧结构（version 1 只有 items）：条目已正确读出，这里补写一次把结构升到 v2
    save();
  }
  bindEvents();
  renderHotkey();
  syncShelfTop();
  window.addEventListener('resize', syncShelfTop);
  shinput.value = state.draft.text || '';
  updateDraftMeta();
  renderShelf();
  render();
  qinput.focus();
  // 和迷你悬浮窗互相同步：数据变了就重画，收到定位请求就打开抽屉
  watchTimer = setInterval(function(){ watchStore(); pollFocusRequest(); }, 1500);
  window.addEventListener('focus', function(){ watchStore(); pollFocusRequest(); });
  claimWindow('main');   // 主面板一开，悬浮窗自动让位
}

init();
})();
</script>
